networks:
  laravel:

services:
  site:
    build:
      context: .
      dockerfile: httpd.dockerfile
    container_name: httpd
    ports:
      - "8080:80"
    volumes:
      - ./site:/var/www/html
    depends_on:
      - php
      - phpmyadmin
      - db
    networks:
      - laravel

  # Holds no volume: the database lives in the container layer and is gone as
  # soon as the container is recreated (see the README).
  db:
    image: mariadb:12.3
    container_name: db
    tty: true
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: atarilegend
      MARIADB_USER: atarilegend
      MARIADB_PASSWORD: atarilegend
      MARIADB_ROOT_PASSWORD: atarilegend
      SERVICE_TAGS: dev
      SERVICE_NAME: db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laravel

  php:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: php
    volumes:
      - ./site:/var/www/html
    ports:
      - "9000:9000"
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      UPLOAD_LIMIT: 8M
      PMA_HOST: db
    networks:
      - laravel
    ports:
      - 8081:80

  composer:
    build:
      context: .
      dockerfile: php.dockerfile
    entrypoint: ['/usr/bin/composer']
    container_name: composer
    volumes:
      - ./site:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - php
    networks:
      - laravel

  npm:
    image: node:22
    container_name: npm
    volumes:
      - ./site:/var/www/html
    working_dir: /var/www/html
    entrypoint: ['npm']
    networks:
      - laravel
    ports:
      - 5173:5173

  artisan:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: artisan
    volumes:
      - ./site:/var/www/html
      # - /path/to/stonish/:/stonish
      # HxC hxcfe binary needed to generate flux dumps track pictures
      - ${HXCFE:-./hxcfe}:/hxcfe
    depends_on:
      # Artisan is how migrations are run, so wait for the server to actually
      # accept connections rather than just for the container to exist.
      db:
        condition: service_healthy
    working_dir: /var/www/html
    entrypoint: ['php', '/var/www/html/artisan']
    networks:
      - laravel
